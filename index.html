<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>アカウント棚卸し</title>

<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<style>
:root{
  --color-bg:#0B0B0C; --color-surface:#151517; --color-surface-elevated:#1D1D20;
  --color-text-primary:#F5F5F3; --color-text-secondary:#A6A6AA; --color-text-disabled:#68686C;
  --color-border:#303034; --color-border-strong:#55555A;
  --color-inverse-bg:#F3F2EE; --color-inverse-text:#111113; --color-danger:#D84C4C;
  --radius-card-large:16px; --radius-card:12px; --radius-input:12px; --radius-button-primary:14px; --radius-button-secondary:12px; --radius-bottom-nav:20px; --radius-chip:999px;
  --s4:4px; --s8:8px; --s12:12px; --s16:16px; --s20:20px; --s24:24px; --s32:32px; --s40:40px;
  --font:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Segoe UI",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{height:100%;background:var(--color-bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--color-bg);color:var(--color-text-primary);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;transition:opacity .15s}
button:active,a:active{opacity:.7}
:focus-visible{outline:2px solid var(--color-text-primary);outline-offset:2px}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}
.label-en{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.08em;color:var(--color-text-secondary)}
.sec-text{font-size:14px;color:var(--color-text-secondary);line-height:1.5}
.micro{font-size:12px;font-weight:500;color:var(--color-text-secondary);line-height:1.4}
.wrap{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.main{flex:1;padding:0 var(--s20) 136px;display:flex;flex-direction:column;gap:var(--s32)}
.main.withcta{padding-bottom:120px}
.appheader{min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:var(--s8);padding:var(--s4) var(--s12) var(--s20) var(--s20)}
.appheader.sub{padding-left:var(--s8);padding-bottom:var(--s8)}
.pagetitle{font-size:28px;font-weight:700;line-height:1.2;margin:0}
.headtitle{font-size:17px;font-weight:600;margin:0}
.iconbtn{width:44px;height:44px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;border-radius:12px;color:var(--color-text-primary)}
.backbtn{height:44px;min-width:44px;border:none;background:transparent;display:flex;align-items:center;gap:var(--s4);padding:0 var(--s8) 0 var(--s4);color:var(--color-text-primary);font-size:16px}
.backbtn span{color:var(--color-text-secondary)}
.sectitle{font-size:22px;font-weight:700;line-height:1.3;margin:0}
.sechead{display:flex;justify-content:space-between;align-items:center;gap:var(--s12)}
.morebtn{height:44px;border:none;background:transparent;display:flex;align-items:center;gap:var(--s4);font-size:14px;color:var(--color-text-secondary);padding:0}
.stack{display:flex;flex-direction:column;gap:var(--s12)}
.stack8{display:flex;flex-direction:column;gap:var(--s8)}
.summary{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-card-large);padding:var(--s20);display:flex;flex-direction:column;gap:var(--s16)}
.summary .top{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s12)}
.bigamt{font-size:46px;font-weight:700;line-height:1.05;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.divider{height:1px;background:var(--color-border)}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.cols3>div{padding:0 var(--s12);border-left:1px solid var(--color-border);display:flex;flex-direction:column;gap:var(--s4);min-width:0}
.cols3>div:first-child{padding-left:0;border-left:none}
.cols3 b{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-card)}
.row{display:flex;align-items:center;gap:var(--s12);padding:var(--s16);background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-card);width:100%;text-align:left;min-height:72px;color:var(--color-text-primary)}
.row .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .t b{font-size:17px;font-weight:600;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex-shrink:0}
.row .r b{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.chev{color:var(--color-text-secondary);flex-shrink:0;display:flex}
.renew .date{display:flex;flex-direction:column;gap:2px;padding-right:var(--s12);border-right:1px solid var(--color-border);width:88px;flex-shrink:0;box-sizing:border-box} /* 「12月31日」が収まる幅 */
.renew .date b{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.renew .rbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.renew .rname{font-size:17px;font-weight:600;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.renew .rmeta{display:flex;flex-wrap:nowrap;justify-content:space-between;align-items:baseline;gap:0 var(--s8);min-width:0}
.renew .rmeta .sec-text{white-space:nowrap}
.renew .rmeta>.sec-text{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis} /* カテゴリ側だけ縮む */
.renew .ramt{margin-left:auto;white-space:nowrap;flex:0 0 auto} /* 金額 / 周期は改行・縮小しない */
.renew .ramt b{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.renew .chev{margin-left:calc(var(--s4) * -1)}
.icontile{width:48px;height:48px;border-radius:14px;background:var(--color-surface-elevated);border:1px solid var(--color-border);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--color-text-primary)}
.icontile.lg{width:64px;height:64px;border-radius:16px}
.icontile.danger{color:var(--color-danger);background:rgba(216,76,76,.12);border-color:rgba(216,76,76,.3)}
.btn{height:56px;border:none;border-radius:var(--radius-button-primary);background:var(--color-inverse-bg);color:var(--color-inverse-text);font-size:16px;font-weight:600;width:100%;display:flex;align-items:center;justify-content:center;gap:var(--s12)}
.btn2{height:48px;border:1px solid var(--color-border);border-radius:var(--radius-button-secondary);background:var(--color-surface);color:var(--color-text-primary);font-size:16px;font-weight:500;width:100%;display:flex;align-items:center;justify-content:center;gap:var(--s12)}
.btn2.danger{color:var(--color-danger);border-color:rgba(216,76,76,.4);background:rgba(216,76,76,.08)}
.btn:disabled,.btn2:disabled{background:var(--color-surface);color:var(--color-text-disabled);pointer-events:none}
.link{height:44px;border:none;background:transparent;color:var(--color-text-secondary);font-size:14px;text-decoration:underline;text-underline-offset:3px;padding:0;align-self:center}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:var(--s16);padding:var(--s40) 0}
.empty .ill{width:120px;height:96px;color:var(--color-text-secondary)}
.empty h2{font-size:22px;font-weight:700;margin:0;line-height:1.3}
.search{display:flex;align-items:center;gap:var(--s12);height:56px;padding:0 var(--s16);background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-input);color:var(--color-text-secondary)}
.search:focus-within{border-color:var(--color-border-strong)}
.search input{border:none;outline:none;background:transparent;font-size:16px;flex:1;min-width:0;color:var(--color-text-primary)}
.search input::placeholder,.inp::placeholder{color:var(--color-text-disabled)}
.chips{display:flex;gap:var(--s8);overflow-x:auto;scrollbar-width:none;margin:0 calc(var(--s20) * -1);padding:0 var(--s20)}
.chips::-webkit-scrollbar{display:none}
.chip{height:44px;padding:0 var(--s20);border-radius:var(--radius-chip);border:1px solid var(--color-border);background:var(--color-surface);white-space:nowrap;font-size:15px;color:var(--color-text-primary);flex-shrink:0}
.chip[aria-pressed="true"]{background:var(--color-inverse-bg);color:var(--color-inverse-text);border-color:var(--color-inverse-bg);font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s12)}

.scard{display:flex;flex-direction:column;align-items:stretch;gap:var(--s12);padding:var(--s16);background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-card);text-align:left;min-height:124px;color:var(--color-text-primary);min-width:0}
.scard .top{display:flex;justify-content:space-between;align-items:flex-start}
.scard .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.scard .t b{font-size:16px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.sechead .sectitle{flex:1;min-width:0}
.morebtn{white-space:nowrap;flex-shrink:0}
.cols3 b{font-size:clamp(15px,4.4vw,18px)}
/* 次回更新カード：狭い画面では余白を詰めて名称・金額の幅を確保（アイコン48px・Chevronは不変） */
@media (max-width:400px){
  .renew{gap:var(--s8);padding-left:var(--s12);padding-right:var(--s12)}
  .renew .date{width:82px;padding-right:var(--s8)}
  .renew .date b{font-size:15px}
}
@media (max-width:380px){
  .renew .date{width:76px}
  .renew .date b{font-size:14px}
  .renew .rname{font-size:16px;line-height:1.4375} /* 行の高さは17px時と同じ約23px＝カード86pxを維持 */
}
@media (max-width:380px){
  .sectitle{font-size:20px}
  .bigamt{font-size:44px}
}
.field{display:flex;flex-direction:column;gap:var(--s8)}
.flabel{font-size:14px;font-weight:600;color:var(--color-text-primary)}
.flabel small{font-weight:400;color:var(--color-text-secondary);margin-left:var(--s8)}
.form{display:flex;flex-direction:column;gap:var(--s20)}
.inp{height:56px;border-radius:var(--radius-input);border:1px solid var(--color-border);background:var(--color-surface);padding:0 var(--s16);font-size:16px;width:100%;color:var(--color-text-primary)}
.inp:focus{outline:none;border-color:var(--color-border-strong)}
textarea.inp{height:116px;padding:var(--s12) var(--s16);resize:none;line-height:1.55}
.amountbox{display:flex;align-items:center;height:56px;border-radius:var(--radius-input);border:1px solid var(--color-border);background:var(--color-surface)}
.amountbox:focus-within{border-color:var(--color-border-strong)}
.amountbox input{flex:1;min-width:0;border:none;outline:none;background:transparent;padding:0 var(--s16);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--color-text-primary)}
.amountbox span{padding:0 var(--s16);border-left:1px solid var(--color-border);color:var(--color-text-secondary);white-space:nowrap;font-size:15px}
.pickrow{height:56px;border-radius:var(--radius-input);border:1px solid var(--color-border);background:var(--color-surface);padding:0 var(--s12) 0 var(--s16);display:flex;align-items:center;justify-content:space-between;width:100%;font-size:16px;color:var(--color-text-primary);text-align:left}
.pickrow .ph{color:var(--color-text-disabled)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s4);padding:var(--s4);background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-input)}
.seg button{height:48px;border:none;border-radius:9px;background:transparent;font-size:15px;color:var(--color-text-primary)}
.seg button[aria-pressed="true"]{background:var(--color-inverse-bg);color:var(--color-inverse-text);font-weight:600}
.counter{position:absolute;right:var(--s12);bottom:var(--s8);font-size:12px;color:var(--color-text-secondary)}
.usechips{display:flex;flex-wrap:wrap;gap:var(--s8)}
.usechip{height:44px;padding:0 var(--s16);border-radius:var(--radius-chip);border:1px solid var(--color-border);background:var(--color-surface);font-size:14px;color:var(--color-text-primary)}
.svchead{display:flex;align-items:center;gap:var(--s16)}
.svchead b{font-size:24px;font-weight:700;line-height:1.3;word-break:break-word}
.glist{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-card)}
.gitem{display:flex;align-items:center;gap:var(--s12);padding:var(--s12) var(--s16);min-height:64px;width:100%;background:transparent;border:none;border-bottom:1px solid var(--color-border);text-align:left;color:var(--color-text-primary);text-decoration:none}
.gitem:last-child{border-bottom:none}
.gitem .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.gitem .t b{font-size:16px;font-weight:600;word-break:break-word}
.meta{display:flex;flex-wrap:wrap;align-items:baseline}
.meta .nw{white-space:nowrap}
.meta .sep{margin:0 2px}
.gitem .ic{color:var(--color-text-secondary);display:flex;width:24px;justify-content:center;flex-shrink:0}
.acct{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-card-large);overflow:hidden}
.acct .head{display:flex;align-items:center;gap:var(--s12);padding:var(--s16);border-bottom:1px solid var(--color-border)}
.acct .head .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.acct .head b{font-size:17px;font-weight:600;word-break:break-all}
.setrow{display:flex;align-items:center;gap:var(--s16);min-height:72px;padding:var(--s12) 0;border:none;border-bottom:1px solid var(--color-border);background:transparent;width:100%;text-align:left;color:var(--color-text-primary)}
.setrow .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.setrow .t b{font-size:17px;font-weight:600}
.setrow.danger .t b{color:var(--color-danger)}
.setrow.disabled{cursor:default;border-bottom:1px solid var(--color-border)}
.setrow.disabled .t b{color:var(--color-text-secondary);font-weight:500}
.setrow.disabled .icontile{color:var(--color-text-disabled);background:transparent}
.soon{font-size:12px;font-weight:500;color:var(--color-text-secondary);border:1px solid var(--color-border);border-radius:var(--radius-chip);padding:2px 10px;white-space:nowrap}
.togglecard{display:flex;align-items:center;justify-content:space-between;gap:var(--s16);padding:var(--s16);background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-card)}
.switch{width:52px;height:32px;border-radius:16px;border:1px solid var(--color-border-strong);background:var(--color-surface-elevated);padding:3px;display:flex;flex-shrink:0;position:relative}
.switch::before{content:"";position:absolute;inset:-6px}
.switch span{width:24px;height:24px;border-radius:12px;background:var(--color-text-secondary);transition:transform .18s}
.switch[aria-pressed="true"]{background:var(--color-inverse-bg);border-color:var(--color-inverse-bg)}
.switch[aria-pressed="true"] span{transform:translateX(20px);background:var(--color-inverse-text)}
.infocard{display:flex;gap:var(--s12);padding:var(--s16);background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-card)}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--color-surface);border-top:1px solid var(--color-border);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));height:64px;padding:0 var(--s12)}
.nav button{background:none;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:500;color:var(--color-text-secondary)}
.nav button[aria-current="page"]{color:var(--color-text-primary);font-weight:600}
.fixedcta{position:fixed;left:0;right:0;bottom:0;padding:var(--s12) var(--s20) calc(var(--s16) + env(safe-area-inset-bottom,0px));background:var(--color-bg);border-top:1px solid var(--color-border);z-index:6}
.fixedcta .in{max-width:520px;margin:0 auto}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--color-surface);border:1px solid var(--color-border);border-bottom:none;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:var(--s24) var(--s20) calc(var(--s24) + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:var(--s16);max-height:88vh;overflow-y:auto}
.sheet .h2{font-size:22px;font-weight:700;margin:0;line-height:1.3}
.sheet .btn,.sheet .btn2{flex-shrink:0}
.note{font-size:14px;color:var(--color-text-secondary);line-height:1.6}
.sheet textarea.inp{height:140px;font-family:var(--mono);font-size:12px}
.daygrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:var(--s4)}
.monthgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:var(--s4)}
.dcell{height:44px;border:1px solid var(--color-border);border-radius:10px;background:var(--color-surface-elevated);font-size:15px;color:var(--color-text-primary);font-variant-numeric:tabular-nums}
.dcell[aria-pressed="true"]{background:var(--color-inverse-bg);color:var(--color-inverse-text);border-color:var(--color-inverse-bg);font-weight:600}
.optrow{display:flex;align-items:center;justify-content:space-between;min-height:56px;padding:0 var(--s4);border:none;border-bottom:1px solid var(--color-border);background:transparent;width:100%;text-align:left;font-size:16px;color:var(--color-text-primary)}
.optrow:last-child{border-bottom:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--color-inverse-bg);color:var(--color-inverse-text);padding:var(--s12) var(--s16);border-radius:12px;font-size:14px;font-weight:600;z-index:30;max-width:90vw;text-align:center}
details.more{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-card)}
details.more summary{list-style:none;min-height:56px;padding:0 var(--s16);display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-size:15px;font-weight:600}
details.more summary::-webkit-details-marker{display:none}
details.more .body{display:flex;flex-direction:column;gap:var(--s20);padding:var(--s4) var(--s16) var(--s20)}
details.more[open] summary svg{transform:rotate(180deg)}
.reveal{animation:reveal .18s ease-out both}
@keyframes reveal{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.btn.sec2{height:48px;background:var(--color-surface);color:var(--color-text-primary);border:1px solid var(--color-border);border-radius:var(--radius-button-secondary);font-weight:500}
.btn.danger{background:var(--color-danger);color:#FFFFFF}
.btn.acc{background:var(--color-inverse-bg);color:var(--color-inverse-text)}
.h2{margin:0}
#print{display:none}
.reveal{animation:reveal .18s ease-out both}
@keyframes reveal{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media print{
  @page{size:A4;margin:14mm}
  body{background:#FFFFFF;color:#22201C}
  .wrap,.nav,.fab,.sheet-bg,.toast,.bottombar,.fixedcta{display:none!important}
  #print{display:block}
}
/* print document */
.pd{font-family:"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;color:#22201C;font-size:10.5pt}
.pd .mincho{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif}
.pd h1{font-size:22pt;margin:0;letter-spacing:.08em}
.pd .head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #22201C;padding-bottom:8pt;margin-bottom:12pt}
.pd .meta{text-align:right;font-size:9.5pt;line-height:1.6}

<script>
(function(){
"use strict";

/* ===== 定数 ===== */
var STORE_KEY = "tanaoroshi:v1";
var APP_ID = "account-tanaoroshi";
var SCHEMA = 1;
var LIMITS = {name:50, plan:40, email:120, nickname:30, memo:500, url:300, items:500, myPresets:100, ownerName:30};

var CATS = [
  {id:"video", label:"動画", color:"#D4533A", fg:"#FFFFFF"},
  {id:"music", label:"音楽", color:"#7457C2", fg:"#FFFFFF"},
  {id:"shop", label:"買い物", color:"#B7801A", fg:"#FFFFFF"},
  {id:"game", label:"ゲーム", color:"#2A8A60", fg:"#FFFFFF"},
  {id:"learning", label:"学習", color:"#857965", fg:"#FFFFFF"},
  {id:"ai", label:"AI", color:"#857965", fg:"#FFFFFF"},
  {id:"tool", label:"仕事", color:"#56688A", fg:"#FFFFFF"},
  {id:"cloud", label:"クラウド", color:"#2C7FB8", fg:"#FFFFFF"},
  {id:"utilities", label:"公共料金", color:"#857965", fg:"#FFFFFF"},
  {id:"telecom", label:"通信", color:"#857965", fg:"#FFFFFF"},
  {id:"map", label:"地図", color:"#857965", fg:"#FFFFFF"},
  {id:"health", label:"健康", color:"#857965", fg:"#FFFFFF"},

var CYCLES = {monthly:"月額", yearly:"年額", free:"無料"};
var PAYMENTS = [["card","カード"],["carrier","携帯料金とまとめて"],["appstore","App Store"],["googleplay","Google Play"],["paypay","PayPay"],["bank","口座振替"],["other","その他"]];
var LOGINS = [["email","メール＋パスワード"],["google","Googleでログイン"],["apple","Appleでログイン"],["line","LINEでログイン"],["x","Xでログイン"],["other","その他"]];
/* 登録先一覧の表示用だけの短い名前（保存値・PDFの表記は変えない） */
var LOGIN_SHORT = {email:"メール認証", google:"Googleログイン", apple:"Appleログイン", line:"LINEログイン", x:"Xログイン", other:"その他"};
var STATUSES = [["active","利用中"],["cancelling","解約予定"],["cancelled","解約済み"]];

/* 公式リンクはプリセット選定のときに確認して入れる（v0.1では空） */
var PRESETS = [
  {id:"netflix", name:"Netflix", cat:"video", ch:"N", accent:"#D6453D"},
  {id:"unext", name:"U-NEXT", cat:"video", ch:"U", accent:"#9C8CD6"},
  {id:"disneyplus", name:"Disney+", cat:"video", ch:"D", accent:"#6E8FD9"},
  {id:"hulu", name:"Hulu", cat:"video", ch:"H", accent:"#4FB77F"},
  {id:"dazn", name:"DAZN", cat:"video", ch:"D", accent:"#AEB85A"},
  {id:"abema", name:"ABEMAプレミアム", cat:"video", ch:"A", accent:"#9A93B0"},
  {id:"youtube-premium", name:"YouTube Premium", cat:"video", ch:"Y", accent:"#E8675F"},
  {id:"spotify", name:"Spotify", cat:"music", ch:"S", accent:"#3CB36A"},
  {id:"apple-music", name:"Apple Music", cat:"music", ch:"A", accent:"#E0607A"},
  {id:"amazon-music", name:"Amazon Music Unlimited", cat:"music", ch:"A", accent:"#4CB6C9"},
  {id:"line-music", name:"LINE MUSIC", cat:"music", ch:"L", accent:"#4DB36E"},
  {id:"amazon-prime", name:"Amazonプライム", cat:"shop", ch:"A", accent:"#4C9BD6"},
  {id:"lyp-premium", name:"LYPプレミアム", cat:"shop", ch:"L", accent:"#C9A24C"},
  {id:"icloud", name:"iCloud+", cat:"cloud", ch:"i", accent:"#5AA6D8"},
  {id:"google-one", name:"Google One", cat:"cloud", ch:"G", accent:"#6F9BE0"},
  {id:"dropbox", name:"Dropbox", cat:"cloud", ch:"D", accent:"#5C8BE0"},
  {id:"ms365", name:"Microsoft 365", cat:"tool", ch:"M", accent:"#D9774A"},
  {id:"nso", name:"Nintendo Switch Online", cat:"game", ch:"N", accent:"#D9504A"},
  {id:"claude-pro", name:"Claude Pro", cat:"ai", ch:"C", accent:"#D9895B"},
  {id:"x-premium", name:"X Premium", cat:"other", ch:"X"},
  {id:"ps-plus", name:"PlayStation Plus", cat:"game", ch:"P", accent:"#5B86D6"}
];

/* ===== 保存 ===== */
var state = {items:[], myPresets:[], settings:{ownerName:"", mask:true}};
var ui = {tab:"subs", screen:"home", id:null, draft:null, filter:"all", q:"", sheet:null, showCancelled:false};

/* Phase A：保存データの読み込み状態（empty / ok / locked / unavailable）。永続保存せず、起動ごとに再判定する */
var store = {status:"empty", reason:""};
var rawAtLoad = null; /* Phase D：保存禁止のときだけ、起動時に読んだ元データを保持（保存しない） */
var LOCK_TOAST = "保存データを守るため、保存を止めています（画面上部の案内をご確認ください）";
function load(){
  var raw;
  try{ raw = window.localStorage.getItem(STORE_KEY); }
  catch(e){ store.status = "unavailable"; return; } /* 保存領域そのものが使えない */
  if(raw === null){ store.status = "empty"; return; }
  rawAtLoad = raw; /* Phase D */
  var obj;
  try{ obj = JSON.parse(raw); }catch(e){ lockStore("保存データが壊れていて読み込めません"); return; }
  var why = storedProblem(obj);
  if(why){ lockStore(why); return; }
  var parsed;
  try{ parsed = validateBackup(obj); }catch(e){ lockStore("保存データを読み込めません"); return; }
  if(!parsed.ok){ lockStore(parsed.reason); return; }
  state.items = parsed.items; state.myPresets = parsed.myPresets; state.settings = parsed.settings; store.status = "ok"; rawAtLoad = null; /* Phase D：正常時は保持しない */
}
/* 異常データの判定（元データは読むだけで、書き換えない） */
function storedProblem(o){
  if(!o || typeof o!=="object" || Array.isArray(o)) return "保存データの形式が正しくありません";
  if(o.app!==APP_ID) return "このアプリの保存データではありません";
  if(o.schemaVersion!==SCHEMA) return (typeof o.schemaVersion==="number" && o.schemaVersion>SCHEMA) ? "新しい版のアプリで保存されたデータです" : "対応していない版の保存データです";
  if(!Array.isArray(o.items)) return "登録データが見つかりません";
  if(o.items.length>LIMITS.items) return "登録が上限（"+LIMITS.items+"件）を超えています";
  var bad = o.items.filter(function(x){ return !x || typeof x!=="object" || !str(x.name, LIMITS.name); }).length;
  if(bad) return "名前のない、または形式が正しくない登録が"+bad+"件あります";
  return "";
}
function lockStore(reason){ store.status = "locked"; store.reason = reason; }
/* 保存禁止中なら案内を出して true（呼び出し側は何も変更せずに戻る） */
function storeLocked(){ if(store.status!=="locked") return false; toast(LOCK_TOAST); return true; }
function save(){
  if(store.status==="locked"){ toast(LOCK_TOAST); return false; } /* Phase A：保存の共通入口で書き込み禁止 */
  try{ window.localStorage.setItem(STORE_KEY, JSON.stringify(exportObj())); return true; }
  catch(e){ toast("保存できませんでした。ブラウザの設定を確認してください"); return false; }
}
/* Phase C：変更後の状態 next を保存できたときだけ確定する。失敗・保存禁止のときは確定状態を元のまま戻す */
function commit(next){ var prev=state; state=next; if(save()) return true; state=prev; return false; }
function cloneState(){ return JSON.parse(JSON.stringify(state)); }
function exportObj(){
  return {app:APP_ID, schemaVersion:SCHEMA, exportedAt:new Date().toISOString(), items:state.items, myPresets:state.myPresets, settings:state.settings};
}

/* ===== 読み込みチェック（守りの3層目） ===== */
function str(v, max){ if(typeof v!=="string") return ""; v=v.replace(/[\u0000-\u001F\u007F]/g," ").trim(); return v.slice(0,max); }
function oneOf(v, list, def){ for(var i=0;i<list.length;i++){ if(list[i]===v) return v; } return def; }
function ids(pairs){ return pairs.map(function(p){return p[0];}); }
function safeUrl(v){ v=str(v, LIMITS.url); if(!v) return ""; if(!/^https:\/\/[^\s"'<>]+$/i.test(v)) return ""; return v; }
function intIn(v, lo, hi){ var n = typeof v==="number" ? v : parseInt(v,10); if(!isFinite(n)) return null; n=Math.round(n); if(n<lo||n>hi) return null; return n; }
function cleanItem(o){
  if(!o || typeof o!=="object") return null;
  var name = str(o.name, LIMITS.name); if(!name) return null;
  var b = (o.billing && typeof o.billing==="object") ? o.billing : {};
  var cycle = oneOf(b.cycle, ["monthly","yearly","free"], "monthly");
  var a = (o.account && typeof o.account==="object") ? o.account : {};
  var l = (o.links && typeof o.links==="object") ? o.links : {};
  return {
    id: /^[a-z0-9_-]{4,40}$/i.test(o.id||"") ? o.id : newId(),
    presetId: /^[a-z0-9_-]{1,40}$/i.test(o.presetId||"") ? o.presetId : null,
    name: name,
    plan: str(o.plan, LIMITS.plan),
    category: oneOf(o.category, CATS.map(function(c){return c.id;}), "other"),
    status: oneOf(o.status, ids(STATUSES), "active"),
    billing: {
      cycle: cycle,
      amount: cycle==="free" ? 0 : (intIn(b.amount,0,10000000)||0),
      month: cycle==="yearly" ? intIn(b.month,1,12) : null,
      day: cycle==="free" ? null : intIn(b.day,1,31)
    },
    payment: oneOf(o.payment, ids(PAYMENTS), "card"),
    links: {cancel: safeUrl(l.cancel), contact: safeUrl(l.contact)},
    account: {email: str(a.email, LIMITS.email), nickname: str(a.nickname, LIMITS.nickname), login: oneOf(a.login, ids(LOGINS), "")},
    memo: str(o.memo, LIMITS.memo),
    checkedAt: /^\d{4}-\d{2}-\d{2}$/.test(o.checkedAt||"") ? o.checkedAt : "",
    updatedAt: typeof o.updatedAt==="string" ? o.updatedAt.slice(0,40) : new Date().toISOString()
  };
}
function validateBackup(obj){
  if(!obj || typeof obj!=="object") return {ok:false, reason:"形式が正しくありません"};
  if(obj.app!==APP_ID) return {ok:false, reason:"このアプリのバックアップではありません"};
  if(obj.schemaVersion!==SCHEMA) return {ok:false, reason:"対応していない版のバックアップです"};
  if(!Array.isArray(obj.items)) return {ok:false, reason:"登録データが見つかりません"};
  if(obj.items.length>LIMITS.items) return {ok:false, reason:"件数が多すぎます（上限"+LIMITS.items+"件）"};
  var items = obj.items.map(cleanItem).filter(Boolean);
  var mp = Array.isArray(obj.myPresets) ? obj.myPresets.slice(0,LIMITS.myPresets).map(function(p){
    if(!p||typeof p!=="object") return null; var n=str(p.name,LIMITS.name); if(!n) return null;
    return {name:n, cat:oneOf(p.cat, CATS.map(function(c){return c.id;}), "other")};
  }).filter(Boolean) : [];
  var s = (obj.settings && typeof obj.settings==="object") ? obj.settings : {};
  return {ok:true, items:items, myPresets:mp, settings:{ownerName:str(s.ownerName,LIMITS.ownerName), mask:s.mask!==false}};
}

/* ===== 便利関数 ===== */
function newId(){ var a=""; var c="abcdefghijklmnopqrstuvwxyz0123456789"; for(var i=0;i<8;i++){ a+=c.charAt(Math.floor(Math.random()*c.length)); } return "i_"+a; }
function cat(id){ for(var i=0;i<CATS.length;i++){ if(CATS[i].id===id) return CATS[i]; } return CATS[CATS.length-1]; }
function label(pairs, id){ for(var i=0;i<pairs.length;i++){ if(pairs[i][0]===id) return pairs[i][1]; } return ""; }
function yen(n){ return Math.round(n).toLocaleString("ja-JP"); }
function todayISO(){ var d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function pad(n){ return (n<10?"0":"")+n; }
function lastDay(y,m){ return new Date(y,m+1,0).getDate(); }
function isPaid(it){ return it.billing.cycle!=="free"; }
function monthly(it){ if(it.billing.cycle==="monthly") return it.billing.amount; if(it.billing.cycle==="yearly") return it.billing.amount/12; return 0; }
function nextRenewal(it){
  var b=it.billing; if(b.cycle==="free"||!b.day) return null;
  var now=new Date(); var t=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  if(b.cycle==="monthly"){
    for(var k=0;k<2;k++){ var y=t.getFullYear(), m=t.getMonth()+k; var d=new Date(y,m,1); var dd=Math.min(b.day,lastDay(d.getFullYear(),d.getMonth())); var c=new Date(d.getFullYear(),d.getMonth(),dd); if(c>=t) return c; }
  }
  if(b.cycle==="yearly" && b.month){
    for(var j=0;j<2;j++){ var yy=t.getFullYear()+j; var d2=Math.min(b.day,lastDay(yy,b.month-1)); var c2=new Date(yy,b.month-1,d2); if(c2>=t) return c2; }
  }
  return null;
}
function daysUntil(d){ if(!d) return null; var now=new Date(); var t=new Date(now.getFullYear(),now.getMonth(),now.getDate()); return Math.round((d-t)/86400000); }
function md(d){ return (d.getMonth()+1)+"/"+d.getDate(); }
function renewText(it){
  var b=it.billing; if(b.cycle==="free") return "無料";
  if(!b.day) return "更新日 未設定";
  var n=nextRenewal(it); return n ? "次回 "+md(n) : "更新日 未設定";
}
function cycleText(it){ var b=it.billing; if(b.cycle==="monthly") return b.day?"毎月"+b.day+"日":"毎月（日付未設定）"; if(b.cycle==="yearly") return (b.month&&b.day)?"毎年"+b.month+"月"+b.day+"日":"毎年（日付未設定）"; return "―"; }
function unit(it){ return it.billing.cycle==="yearly"?"年":"月"; }
function windowText(it){
  if(it.payment==="appstore") return "iPhoneの「設定」";
  if(it.payment==="googleplay") return "Google Playの定期購入";
  if(it.payment==="carrier") return it.name+"のサイト、または携帯会社";
  return it.name+"のサイト";
}
function mask(email){
  if(!email) return "";
  var at=email.indexOf("@"); if(at<1) return email.slice(0,2)+"****";
  return email.slice(0,Math.min(2,at))+"****"+email.slice(at);
}
function byId(id){ for(var i=0;i<state.items.length;i++){ if(state.items[i].id===id) return state.items[i]; } return null; }

/* 要素づくり：利用者の入力は必ず文字として入れる（innerHTMLは使わない） */
function h(tag, props){
  var el=document.createElement(tag);
  if(props){ for(var k in props){ if(!Object.prototype.hasOwnProperty.call(props,k)) continue; var v=props[k];
    if(v===null||v===undefined||v===false) continue;
    if(k==="class") el.className=v;
    else if(k==="text") el.textContent=v;
    else if(k==="style") el.setAttribute("style",v);
    else if(k.slice(0,2)==="on") el.addEventListener(k.slice(2),v);
    else el.setAttribute(k, v===true?"":v);
  } }
  for(var i=2;i<arguments.length;i++){ add(el, arguments[i]); }
  return el;
}
function add(el, c){ if(c===null||c===undefined||c===false) return; if(Array.isArray(c)){ c.forEach(function(x){add(el,x);}); return; } if(typeof c==="string"||typeof c==="number"){ el.appendChild(document.createTextNode(String(c))); return; } el.appendChild(c); }
var SVGNS="http://www.w3.org/2000/svg";
function icon(paths, color, size, sw){
  var s=document.createElementNS(SVGNS,"svg"); s.setAttribute("width",size||22); s.setAttribute("height",size||22); s.setAttribute("viewBox","0 0 24 24"); s.setAttribute("fill","none"); s.setAttribute("stroke",color||"currentColor"); s.setAttribute("stroke-width",sw||2.2); s.setAttribute("stroke-linecap","round"); s.setAttribute("stroke-linejoin","round"); s.setAttribute("aria-hidden","true");
  paths.forEach(function(p){ var e=document.createElementNS(SVGNS,p[0]); for(var k in p[1]){ e.setAttribute(k,p[1][k]); } s.appendChild(e); });
  return s;
}

  plus:[["path",{d:"M12 5v14M5 12h14"}]],

};
function catIcon(c, ch, size){ var s=size||38; return h("span",{class:"ic",style:"background:"+c.color+";color:"+c.fg+";width:"+s+"px;height:"+s+"px;border-radius:"+Math.round(s*0.27)+"px;font-size:"+Math.round(s*0.42)+"px"}, ch||"?"); }
function firstChar(name){ var m=name.match(/[A-Za-z0-9]/); return m ? m[0] : name.charAt(0); }

/* ===== トースト・シート ===== */
var toastTimer=null;
function toast(msg){
  var old=document.querySelector(".toast"); if(old) old.remove();
  var t=h("div",{class:"toast",role:"status"},msg); document.body.appendChild(t);
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){ t.remove(); },2400);
}
function openSheet(build){ ui.sheet=build; renderSheet(); }
function closeSheet(){ ui.sheet=null; renderSheet(); }
function renderSheet(){
  var old=document.querySelector(".sheet-bg"); if(old) old.remove();
  if(!ui.sheet) return;
  var sheet=h("div",{class:"sheet",role:"dialog","aria-modal":"true"});
  add(sheet, ui.sheet());
  var bg=h("div",{class:"sheet-bg",onclick:function(e){ if(e.target===bg) closeSheet(); }}, sheet);
  document.body.appendChild(bg);
  var f=sheet.querySelector("button,input,textarea"); if(f) f.focus();
}
function confirmSheet(title, body, okLabel, danger, onOk){
  openSheet(function(){ return [
    h("div",{class:"h2",text:title}),
    h("div",{class:"note",style:"font-size:14px",text:body}),
    h("button",{class:"btn"+(danger?" danger":""),onclick:function(){ closeSheet(); onOk(); }}, okLabel),
    h("button",{class:"btn sec2",onclick:closeSheet},"やめる")
  ]; });
}

/* ===== 画面切り替え ===== */
function go(screen, extra){ ui.screen=screen; if(extra){ for(var k in extra){ ui[k]=extra[k]; } } render(); window.scrollTo(0,0); afterNav(); }
/* 一覧の一時UI状態（永続データには保存しない） */
function listSnapshot(){ return {screen:ui.screen, homeSearch:!!ui.homeSearch, hq:ui.hq||"", allSoon:!!ui.allSoon, allRecent:!!ui.allRecent, showCancelled:!!ui.showCancelled, scrollY:window.scrollY||0}; }
function openDetail(id){ ui.listSnap=listSnapshot(); go("detail",{id:id}); }
function backToList(target){
  var sn=ui.listSnap; ui.listSnap=null;
  if(sn && sn.screen===target){ ui.homeSearch=sn.homeSearch; ui.hq=sn.hq; ui.allSoon=sn.allSoon; ui.allRecent=sn.allRecent; ui.showCancelled=sn.showCancelled; ui.restoreScroll=sn.scrollY; }
  go(target);
}
function resetTempUi(){ ui.homeSearch=false; ui.hq=""; ui.allSoon=false; ui.allRecent=false; ui.showCancelled=false; ui.listSnap=null; ui.flowOrigin=null; ui.q=""; ui.filter="all"; ui.selectScroll=0; ui.restoreScroll=null; }

function groupsByEmail(){
  var groups={}, order=[], missing=[];
  state.items.forEach(function(it){
    var e=it.account.email.trim().toLowerCase();
    if(!e){ missing.push(it); return; }
    if(!groups[e]){ groups[e]={email:it.account.email.trim(), nick:"", items:[]}; order.push(e); }
    if(!groups[e].nick && it.account.nickname) groups[e].nick=it.account.nickname;
    groups[e].items.push(it);
  });
  return {list:order.map(function(k){ return groups[k]; }), missing:missing};
}
